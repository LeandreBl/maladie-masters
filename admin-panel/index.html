<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maladie Masters — Admin</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Organic's two faces. Preconnected so the request overlaps the module
         graph download instead of queueing behind it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap"
    />

    <script>
      // Stamp the theme before first paint. Without this the panel renders
      // light for one frame and then flips, which reads as a bug.
      (function () {
        try {
          var stored = localStorage.getItem("maladie-admin-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          // Private mode or blocked storage: the light default is correct.
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
