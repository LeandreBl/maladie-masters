# Production behind an existing Traefik: nothing is published on the host,
# Traefik reaches the containers through its own Docker network and handles
# TLS. Postgres and Redis stay on the internal compose network only.
#
# Select it from .env with:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml
#
# Each host also gets a router on the plain HTTP entrypoint that only redirects
# to HTTPS: without it, typing the address without https:// lands on a 404.
# Traefik's own ACME challenge router outranks it, so certificates still renew.
# The middleware is declared on every service, identically, so that each
# redirect keeps working while another container is down.

services:
  backend:
    networks: [default, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.maladie-masters-api.rule=Host(`${API_HOST:?API_HOST is required, see example.env}`)
      - traefik.http.routers.maladie-masters-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.maladie-masters-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.maladie-masters-api.loadbalancer.server.port=3000
      - traefik.http.routers.maladie-masters-api-http.rule=Host(`${API_HOST:?API_HOST is required, see example.env}`)
      - traefik.http.routers.maladie-masters-api-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.maladie-masters-api-http.middlewares=maladie-masters-https
      - traefik.http.middlewares.maladie-masters-https.redirectscheme.scheme=https
      - traefik.http.middlewares.maladie-masters-https.redirectscheme.permanent=true

  # Same host as the API, path /ws: no extra DNS name or certificate. The
  # longer rule wins in Traefik, but the priority makes it explicit.
  websocket-relay:
    networks: [default, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.maladie-masters-ws.rule=Host(`${API_HOST:?API_HOST is required, see example.env}`) && Path(`/ws`)
      - traefik.http.routers.maladie-masters-ws.priority=100
      - traefik.http.routers.maladie-masters-ws.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.maladie-masters-ws.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.maladie-masters-ws.loadbalancer.server.port=3000

  frontend:
    networks: [default, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.maladie-masters-front.rule=Host(`${FRONTEND_HOST:?FRONTEND_HOST is required, see example.env}`)
      - traefik.http.routers.maladie-masters-front.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.maladie-masters-front.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.maladie-masters-front.loadbalancer.server.port=8080
      - traefik.http.routers.maladie-masters-front-http.rule=Host(`${FRONTEND_HOST:?FRONTEND_HOST is required, see example.env}`)
      - traefik.http.routers.maladie-masters-front-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.maladie-masters-front-http.middlewares=maladie-masters-https
      - traefik.http.middlewares.maladie-masters-https.redirectscheme.scheme=https
      - traefik.http.middlewares.maladie-masters-https.redirectscheme.permanent=true

  admin-panel:
    networks: [default, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.maladie-masters-admin.rule=Host(`${ADMIN_HOST:?ADMIN_HOST is required, see example.env}`)
      - traefik.http.routers.maladie-masters-admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.maladie-masters-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.maladie-masters-admin.loadbalancer.server.port=8080
      - traefik.http.routers.maladie-masters-admin-http.rule=Host(`${ADMIN_HOST:?ADMIN_HOST is required, see example.env}`)
      - traefik.http.routers.maladie-masters-admin-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.maladie-masters-admin-http.middlewares=maladie-masters-https
      - traefik.http.middlewares.maladie-masters-https.redirectscheme.scheme=https
      - traefik.http.middlewares.maladie-masters-https.redirectscheme.permanent=true

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
