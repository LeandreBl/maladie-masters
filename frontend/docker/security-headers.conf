# Included in the server block and again in every location that sets its own
# header: nginx drops the inherited add_header directives as soon as a level
# declares one, which silently left the app without any of these.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Served behind Traefik's TLS: browsers only honour it over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
