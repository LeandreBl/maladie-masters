<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;box-sizing:border-box;aspect-ratio:5/7;border-radius:0.9em;overflow:hidden;display:flex;flex-direction:column;gap:0.55em;padding:0.7em;color:var(--text);font-family:'Bricolage Grotesque','Noto Sans SC',system-ui,sans-serif;text-align:left;border-style:solid;border-width:0.16em;width:{{ wpx }};font-size:{{ fspx }};opacity:{{ op }};background:{{ cardBg }};border-color:{{ frame }};box-shadow:{{ shadow }}">
  <sc-if value="{{ isTop }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0.3em;border:1px solid;border-radius:0.65em;pointer-events:none;opacity:0.55;border-color:{{ col }}"></div>
  </sc-if>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:0.68em;color:var(--muted);letter-spacing:0.04em">{{ num }}</span>
    <span style="width:0.6em;height:0.6em;transform:rotate(45deg);border-radius:0.1em;margin-right:0.2em;background:{{ col }}"></span>
  </div>
  <div style="position:relative;aspect-ratio:4/3;border-radius:0.55em;border:1px solid var(--line);display:grid;place-items:center;background:{{ stripe }};filter:{{ artFilter }}">
    <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:0.52em;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;text-align:center;padding:0 1em">{{ c.thumb }}</span>
    <sc-if value="{{ c.isShiny }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;inset:0;border-radius:inherit;backdrop-filter:invert(1) hue-rotate(180deg);-webkit-backdrop-filter:invert(1) hue-rotate(180deg);pointer-events:none"></span>
    </sc-if>
    <sc-if value="{{ c.hidden }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;inset:0;display:grid;place-items:center;font-size:2.6em;font-weight:800;opacity:0.45;color:{{ col }}">?</span>
    </sc-if>
    <sc-if value="{{ c.qtyLabel }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;bottom:0.5em;right:0.5em;background:var(--text);color:var(--bg);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:0.55em;font-weight:500;padding:0.2em 0.5em;border-radius:0.35em">{{ c.qtyLabel }}</span>
    </sc-if>
    <sc-if value="{{ c.isShiny }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:0.5em;right:0.5em;background:linear-gradient(90deg,#ff7ab6,#ffd36e,#7dffb0,#7ab8ff);color:#1a1215;font-size:0.55em;font-weight:800;letter-spacing:0.08em;padding:0.25em 0.55em;border-radius:0.35em">✦ {{ c.shinyLabel }}</span>
    </sc-if>
    <sc-if value="{{ c.isNew }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:0.5em;left:0.5em;background:var(--accent);color:#fff;font-size:0.55em;font-weight:800;letter-spacing:0.08em;padding:0.25em 0.55em;border-radius:0.35em">{{ c.newLabel }}</span>
    </sc-if>
  </div>
  <div style="font-size:1.12em;font-weight:700;line-height:1.08;letter-spacing:-0.01em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{ c.name }}<sc-if value="{{ c.langBadge }}" hint-placeholder-val="{{ false }}"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:0.45em;font-weight:500;border:1px solid var(--line);color:var(--muted);padding:0.1em 0.4em;border-radius:0.3em;margin-left:0.4em;vertical-align:middle">{{ c.langBadge }}</span></sc-if></div>
  <div style="font-size:0.7em;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{ c.desc }}</div>
  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:0.5em;border-top:1px solid var(--line);padding-top:0.5em">
    <span style="font-size:0.62em;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:{{ col }}">{{ c.rarityLabel }}</span>
    <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:0.56em;color:var(--muted)">{{ c.views }}</span>
  </div>
  <sc-if value="{{ c.isShiny }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:color;opacity:0.18;background:linear-gradient(120deg,#ff5fa2,#ffcf5c,#5cffa0,#5cb8ff,#c45cff,#ff5fa2);background-size:300% 300%;animation:mmHolo 4s linear infinite"></div>
    <div style="position:absolute;inset:0;border-radius:0.75em;padding:0.22em;pointer-events:none;background:linear-gradient(120deg,#ff5fa2,#ffcf5c,#5cffa0,#5cb8ff,#c45cff,#ff5fa2);background-size:300% 300%;animation:mmHolo 3s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude"></div>
  </sc-if>
  <sc-if value="{{ holo }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,0.3) 42%,rgba(255,214,120,0.24) 50%,rgba(160,200,255,0.2) 58%,transparent 75%);background-size:260% 100%;animation:mmHolo 2.8s linear infinite"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:380},&quot;card&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:240,&quot;tsType&quot;:&quot;number&quot;},&quot;holo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.card || {};
    const w = Number(this.props.w) || 240;
    const r = (c.rarity || 'COMMON').toLowerCase();
    const col = `var(--r-${r})`;
    const isTop = r === 'epic' || r === 'legendary';
    return {
      c, col, isTop, op: c.hidden ? 0.55 : 1,
      frame: c.isShiny ? 'transparent' : col,
      cardBg: c.isShiny ? 'linear-gradient(var(--card-bg), var(--card-bg)) padding-box, conic-gradient(from 210deg, #ff7ab6, #ffd36e, #7dffb0, #7ab8ff, #c47aff, #ff7ab6) border-box' : 'var(--card-bg)',
      artFilter: c.isShiny ? 'invert(1) hue-rotate(180deg)' : 'none',
      holo: !!this.props.holo,
      wpx: w + 'px',
      fspx: (w / 15) + 'px',
      num: c.num || '',
      shadow: r === 'legendary' ? `0 0 0 1px ${col}, 0 20px 60px -16px ${col}` : r === 'epic' ? `0 18px 48px -18px ${col}` : '0 10px 30px -18px rgba(0,0,0,0.5)',
      stripe: `repeating-linear-gradient(135deg, color-mix(in oklch, ${col} 18%, transparent) 0 0.4em, transparent 0.4em 0.8em)`
    };
  }
}
</script>
</body>
</html>
